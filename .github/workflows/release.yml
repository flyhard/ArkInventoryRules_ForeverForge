name: Release

# Push a tag like v1.0.1 to build the addon zip, attach it to a GitHub
# release and, once CF_API_KEY and X-Curse-Project-ID are set, upload it to
# CurseForge.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
